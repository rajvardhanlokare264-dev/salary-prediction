<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Contact Us - SalaryPredictor</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Animate.css for animations -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1E2A38, #0F172A);
            color: #fff;
            margin-top: 80px;
        }
        /* Navbar Styles */
        .navbar {
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 20px;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            transition: all 0.3s ease-in-out;
        }

        .navbar a {
            color: white;
            padding: 10px 20px;
            font-size: 1.1rem;
            text-transform: uppercase;
            transition: 0.3s;
        }
        .navbar a:hover {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
        }

        .navbar i {
            font-size: 1.5rem;
            color: white;
        }

        .contact-container {
            margin: 100px auto;
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0px 4px 15px rgba(255, 255, 255, 0.1);
            max-width: 500px;
            width: 100%;
        }

        .btn-back {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">SalaryPredictor</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('home') }}">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('about') }}">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('prediction') }}">Prediction</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('mnc') }}">MNC Companies</a></li>
                    <li class="nav-item"><a class="nav-link active" href="{{ url_for('contact') }}">Contact</a></li>
                    <!-- Person Icon Button -->
                    <li class="nav-item">
                        {% if 'username' in session %}
                            <a class="nav-link" href="{{ url_for('logout') }}">
                                <i class="bi bi-box-arrow-right"></i> Logout
                            </a>
                        {% else %}
                            <a class="nav-link" href="{{ url_for('login') }}">
                                <i class="bi bi-person"></i> Login
                            </a>
                        {% endif %}
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="contact-container animate__animated animate__fadeIn">
        <h2>Contact Us</h2>
        <p>Have questions? Reach out to us!</p>
        <form id="contactForm">
            <input type="text" id="name" class="form-control mb-3" placeholder="Your Name" required>
            <input type="email" id="email" class="form-control mb-3" placeholder="Your Email" required>
            <textarea id="message" class="form-control mb-3" rows="4" placeholder="Your Message" required></textarea>
            <button type="submit" class="btn btn-primary" id="submitBtn">Submit</button>
            <div id="statusMessage" class="mt-3" style="display: none;"></div>
        </form>
        <a href="{{url_for('home')}}" class="btn btn-light btn-back">Back to Home</a>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>

    <script>
        document.getElementById("contactForm").addEventListener("submit", async function(event) {
            event.preventDefault();
            
            const submitBtn = document.getElementById("submitBtn");
            const statusMessage = document.getElementById("statusMessage");
            
            // Disable submit button and show loading state
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Sending...';
            
            try {
                const name = document.getElementById("name").value;
                const email = document.getElementById("email").value;
                const message = document.getElementById("message").value;

                const response = await fetch("/contact", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name, email, message })
                });

                const data = await response.json();
                
                // Show status message
                statusMessage.style.display = "block";
                statusMessage.className = "mt-3 alert " + (response.ok ? "alert-success" : "alert-danger");
                statusMessage.textContent = data.message;

                // Clear form after successful submission
                if (response.ok) {
                    document.getElementById("contactForm").reset();
                }
            } catch (error) {
                statusMessage.style.display = "block";
                statusMessage.className = "mt-3 alert alert-danger";
                statusMessage.textContent = "An error occurred. Please try again.";
            } finally {
                // Re-enable submit button
                submitBtn.disabled = false;
                submitBtn.innerHTML = "Submit";
            }
        });
    </script>
</body>
</html>
