<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salary Prediction</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1E2A38, #0F172A);
            color: white;
            margin-top: 80px;
        }
        /* Navbar Styles */
        .navbar {
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 20px;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            transition: all 0.3s ease-in-out;
        }

        .navbar a {
            color: white;
            padding: 10px 20px;
            font-size: 1.1rem;
            text-transform: uppercase;
            transition: 0.3s;
        }
        .navbar a:hover {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
        }

        .navbar i {
            font-size: 1.5rem;
            color: white;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
            max-width: 600px;
            margin: auto;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            font-weight: bold;
        }
        .form-control {
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
        }
        .form-control:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: #FF416C;
            color: white;
            box-shadow: none;
        }
        .btn-primary {
            background: linear-gradient(90deg, #FF416C, #FF4B2B);
            border: none;
            transition: all 0.3s;
        }
        .btn-primary:hover {
            background: linear-gradient(90deg, #FF4B2B, #FF416C);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 65, 108, 0.3);
        }
        .result-container {
            margin-top: 30px;
            display: none;
            text-align: center;
        }
        .result-container p {
            font-size: 1.2rem;
            font-weight: bold;
        }
        .companies-container {
            margin-top: 30px;
            display: none;
            text-align: left;
        }
        .companies-container ul {
            list-style-type: none;
            padding: 0;
        }
        .companies-container li {
            font-size: 1.2rem;
            margin: 5px 0;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 5px;
            transition: all 0.3s;
        }
        .companies-container li:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(5px);
        }
        select.form-control option {
            background: #1E2A38;
            color: white;
        }
        label {
            text-align: left;
            display: block;
            margin-bottom: 5px;
            color: rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">SalaryPredictor</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav"></div>
        </div>
    </nav>
    <div class="container">
        <h1>Salary Prediction</h1>
        <form id="salaryForm">
            <label for="education">Education Level:</label>
            <select class="form-control" name="education" id="education" required>
                <option value="">Select</option>
                <option value="PhD">PhD</option>
                <option value="Master">Master's</option>
                <option value="Bachelor">Bachelor's</option>
                <option value="Associate">Associate Degree</option>
                <option value="Diploma">Diploma</option>
                <option value="High School">High School</option>
            </select>
            
            <label for="job_role">Job Role:</label>
            <select class="form-control" id="job_role" name="job_role" required disabled>
                <option value="">Select</option>
            </select>
            
            <label for="location">Location:</label>
            <select class="form-control" id="location" name="location" required>
                <option value="">Select</option>
                <option value="Mumbai">Mumbai</option>
                <option value="Bangalore">Bangalore</option>
                <option value="Delhi">Delhi</option>
                <option value="Hyderabad">Hyderabad</option>
                <option value="Pune">Pune</option>
                <option value="Chennai">Chennai</option>
                <option value="Kolkata">Kolkata</option>
            </select>
            
            <label for="experience">Years of Experience:</label>
            <input type="number" class="form-control" name="experience" id="experience" required min="0" step="0.5" placeholder="Enter years of experience">
            
            <button type="submit" class="btn btn-primary w-100">Predict Salary</button>
        </form>

        <!-- Result Section -->
        <div id="resultContainer" class="result-container">
            <p id="resultText">For <span id="resultExperience"></span> years of experience, the predicted salary is: ₹<span id="predictedSalary"></span></p>
        </div>

        <!-- Companies Section -->
        <div id="companiesContainer" class="companies-container">
            <h3>Possible Companies Hiring for this Role:</h3>
            <ul id="companiesList"></ul>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
    
    <!-- JavaScript to handle form submission and display result -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const educationSelect = document.getElementById('education');
            const jobRoleSelect = document.getElementById('job_role');
            
            // Update job roles when education level changes
            educationSelect.addEventListener('change', async function() {
                jobRoleSelect.disabled = true;
                jobRoleSelect.innerHTML = '<option value="">Loading...</option>';
                
                try {
                    const education = this.value;
                    if (!education) {
                        jobRoleSelect.innerHTML = '<option value="">Select Job Role</option>';
                        jobRoleSelect.disabled = true;
                        return;
                    }
                    
                    const response = await fetch(`/get_jobs_by_education/${education}`);
                    const jobs = await response.json();
                    
                    jobRoleSelect.innerHTML = '<option value="">Select Job Role</option>';
                    jobs.forEach(job => {
                        const option = document.createElement('option');
                        option.value = job;
                        option.textContent = job;
                        jobRoleSelect.appendChild(option);
                    });
                    
                    jobRoleSelect.disabled = false;
                } catch (error) {
                    console.error('Error fetching job roles:', error);
                    jobRoleSelect.innerHTML = '<option value="">Error loading job roles</option>';
                }
            });
            
            document.getElementById('salaryForm').addEventListener('submit', function(e) {
                e.preventDefault();
            
                // Get form values
                var experience = document.getElementById('experience').value;
                var education = document.getElementById('education').value;
                var jobRole = document.getElementById('job_role').value;
                var location = document.getElementById('location').value;
            
                // Check if experience is 0 or negative and show alert
                if (experience < 0) {
                    alert("Please enter valid years of experience.");
                    document.getElementById('resultContainer').style.display = 'none';
                    document.getElementById('companiesContainer').style.display = 'none';
                    return;  
                }
            
                // Perform AJAX request to Flask backend
                fetch('/predict_salary', {
                    method: 'POST',
                    body: new URLSearchParams({
                        'experience': experience,
                        'education': education,
                        'job_role': jobRole,
                        'location': location
                    }),
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    }
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.error) {
                        throw new Error(data.error);
                    }
                    // Display result
                    document.getElementById('resultExperience').textContent = experience;
                    document.getElementById('predictedSalary').textContent = data.predicted_salary;
                    document.getElementById('resultContainer').style.display = 'block';
            
                    // Display companies
                    var companiesList = document.getElementById('companiesList');
                    companiesList.innerHTML = '';
                    data.companies.forEach(function(company) {
                        var listItem = document.createElement('li');
                        listItem.textContent = company;
                        companiesList.appendChild(listItem);
                    });
            
                    document.getElementById('companiesContainer').style.display = 'block';
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert(error.message || 'An error occurred during prediction. Please try again.');
                });
            });
        });
    </script>
</body>
  </html>
